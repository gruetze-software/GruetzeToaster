app-id: de.gruetze_software.GruetzeToaster
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: gruetzetoaster
finish-args:
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  - --device=dri
modules:
  - name: gruetzetoaster
    buildsystem: simple
    build-commands:
      - cp -a . /app/
    sources:
      - type: dir
        path: ../../artifacts/flatpak-payload
