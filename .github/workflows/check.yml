name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Tests
        run: dotnet test GruetzeToaster.sln -c Release --logger trx
      - name: Compile release
        run: dotnet publish GruetzeToaster/GruetzeToaster.csproj -c Release --self-contained false -o artifacts/smoke
      - name: CLI smoke test
        run: dotnet artifacts/smoke/gruetzetoaster.dll --help
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
